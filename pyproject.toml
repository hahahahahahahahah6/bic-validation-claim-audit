[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bic-validation-claim-audit"
version = "0.1.0"
description = "Offline audit of documentation claims against Python source"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
bic-validation-claim-audit = "bic_validation_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["bic_validation_claim_audit*", "tests*"]
